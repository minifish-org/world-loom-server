[package]
name = "world-loom-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
valence = { version = "0.2.0-alpha.1", default-features = false, features = [
    "inventory",
    "log",
    "network",
    "player_list",
] }

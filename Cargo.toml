[package]
name = "world-loom-server"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
fastanvil = { version = "0.32", default-features = false }
fastnbt = "2"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
valence = { version = "0.2.0-alpha.1", default-features = false, features = [
  "inventory",
  "log",
  "network",
    "player_list",
] }
